# A mirror of .gitlab-ci.yml, so the checks also run where this repository is hosted.
name: ci

on:
  push:
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test
      - name: validate the example
        run: |
          cd examples/basic
          terraform init -backend=false
          terraform validate

  pwctl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pwctl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: tools/pwctl/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
