# The module talks to no cloud API, so no job needs a secret or an account.
name: ci

on:
  push:
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test
      - name: validate the example
        run: |
          cd examples/basic
          terraform init -backend=false
          terraform validate

  pwctl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck tools/pwctl tools/pwctl_test.sh
      - run: tools/pwctl_test.sh
